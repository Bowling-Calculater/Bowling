<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3567a8">
<title>Pot of Gold Scorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="pin" viewBox="0 0 24 24">
    <path d="M12 1.5c-1.8 0-2.7 1.5-2.7 3.1 0 1.2.5 2.1.9 2.9-.3.7-.9 1.4-1.5 2.5-1.1 1.6-1.4 3.2-1.4 4.9 0 3.1 1.5 5.7 2.5 7.1h4.4c1-1.4 2.5-4 2.5-7.1 0-1.7-.3-3.3-1.4-4.9-.6-1.1-1.2-1.8-1.5-2.5.4-.8.9-1.7.9-2.9 0-1.6-.9-3.1-2.7-3.1z" fill="currentColor"/>
    <path d="M10 8.4h4M9.5 9.9h5" stroke="#e5484d" stroke-width="1.1" stroke-linecap="round"/>
  </symbol>
</svg>

<header class="bar">
  <span id="live" class="live off" title="Live updates"></span>
  <h1><svg class="pin"><use href="#pin"/></svg>Pot of Gold Scorer</h1>
  <button id="menuBtn" class="menu-btn" aria-label="Menu" aria-expanded="false" aria-controls="menu"><span></span><span></span><span></span></button>
  <nav id="menu" class="menu" hidden>
    <div class="menu-team">Texas Strangers</div>
    <button id="logout" class="menu-item">Change Team Code</button>
  </nav>
</header>

<section id="gate" hidden>
  <form id="gateForm" class="card gate-card">
    <div class="gate-badge"><svg class="pin"><use href="#pin"/></svg></div>
    <h2 class="gate-title">Pot of Gold Scorer</h2>
    <p class="gate-sub">Texas Strangers · League Night Scoring</p>
    <label for="code">Team Code</label>
    <input id="code" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Enter Your Team Code" required>
    <button class="btn-primary">Enter</button>
    <p id="gateErr" class="err"></p>
    <p class="banner">Snap the lane screen after each game. Scores update for the whole team live.</p>
  </form>
</section>

<main id="app" hidden>
  <div class="pill-nav">
    <button id="prevNight" class="pill-arrow" aria-label="Previous Week">&#8592;</button>
    <label class="pill-date"><span id="nightLbl">Tonight</span><span class="caret">&#9662;</span><input type="date" id="night" aria-label="Night"></label>
    <button id="nextNight" class="pill-arrow" aria-label="Next Week">&#8594;</button>
  </div>
  <div class="sb" id="scoreboard">
    <div id="sbMain" aria-live="polite"></div>
    <div class="tabs" id="gamePick" role="tablist" aria-label="Game">
      <button data-g="1" role="tab">Game 1<span class="ts">–</span></button><button data-g="2" role="tab">Game 2<span class="ts">–</span></button><button data-g="3" role="tab">Game 3<span class="ts">–</span></button><button data-g="S" role="tab">Series<span class="ts">–</span></button>
    </div>
  </div>
  <div class="wrap">
    <div class="banner demo" id="demoBar" hidden>Demo Mode: Sample Night, Nothing Is Saved <button class="btn-sm" id="demoNext">Add Next Game</button></div>
    <label class="snap"><svg class="cam" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l1.6-2.2h6.8L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="13.3" r="3.6" fill="none" stroke="currentColor" stroke-width="1.8"/></svg><span id="snapLbl">Snap Photo</span><input type="file" id="cam" accept="image/*" capture="environment" hidden></label>
    <label class="btn-outline pick">Choose Photos (Both Lanes)<input type="file" id="lib" accept="image/*" multiple hidden></label>
    <ul id="uploads"></ul>
    <div id="board"></div>
    <details id="screensBox" class="card screens-box"><summary>Screens &amp; Fixes <small>Tap Any Number to Fix It</small></summary><div id="screens"></div></details>
  </div>
</main>
<script type="module" src="app.js"></script>
</body>
</html>

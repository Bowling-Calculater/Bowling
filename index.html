<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0A10">
<meta name="color-scheme" content="dark">
<title>Pot of Gold Scorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=11">
</head>
<body>
<section id="gate" hidden>
  <form id="gateForm" class="glass gate-card">
    <svg class="gate-art" viewBox="0 0 200 104" aria-hidden="true">
      <defs><radialGradient id="gBall" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#b48ae6"/><stop offset=".6" stop-color="#6a3fa8"/><stop offset="1" stop-color="#3a1f5c"/></radialGradient>
        <g id="gPin"><path d="M0-30c-4 0-6 3.4-6 7 0 2.7 1.2 4.7 2 6.5-.7 1.6-2 3.1-3.4 5.6C-9.9-7.3-10.6-3.7-10.6 0c0 7 3.4 12.8 5.6 16h10c2.2-3.2 5.6-9 5.6-16 0-3.7-.7-7.3-3.2-10.9-1.4-2.5-2.7-4-3.4-5.6.8-1.8 2-3.8 2-6.5 0-3.6-2-7-6-7z" fill="#F4F2FA" stroke="rgba(255,255,255,.3)" stroke-width="1.2"/><path d="M-4.6-14.4h9.2M-5.4-11h10.8" stroke="#F2A900" stroke-width="1.8" stroke-linecap="round"/></g></defs>
      <ellipse cx="100" cy="94" rx="92" ry="7" fill="rgba(255,255,255,.06)"/>
      <path d="M139 18l4 9 9-3-4 9 8 5-9 3 1 10-8-6-6 7-1-9-9-1 7-6-5-8 9 1z" fill="#FFC531" opacity=".9"/>
      <use href="#gPin" transform="translate(118 78) rotate(-14)"/><use href="#gPin" transform="translate(146 76) scale(1.08)"/><use href="#gPin" transform="translate(172 80) rotate(18)"/>
      <path d="M22 66h-14M28 76h-20M22 86h-10" stroke="#FFC531" stroke-width="3" stroke-linecap="round"/>
      <circle cx="62" cy="72" r="22" fill="url(#gBall)"/><circle cx="55" cy="63" r="3" fill="#1a0f2a"/><circle cx="64" cy="61" r="3" fill="#1a0f2a"/><circle cx="61" cy="70" r="3.4" fill="#1a0f2a"/>
      <ellipse cx="52" cy="82" rx="7" ry="3.4" fill="#fff" opacity=".22" transform="rotate(-30 52 82)"/>
    </svg>
    <h2 class="gate-title">Pot of Gold Scorer</h2>
    <p class="gate-sub">Texas Strangers · League Night</p>
    <label for="code">Team Code</label>
    <input id="code" class="inp" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Enter Your Team Code" required>
    <button class="addp big">Enter</button>
    <p id="gateErr" class="err"></p>
  </form>
</section>

<div id="app" hidden>
<header class="top">
  <div class="ht"><div class="htl"><h1 id="h1">Tonight</h1><div class="sub"><span id="live" class="live off" title="Live Updates" hidden></span><span id="sub"></span></div></div><div id="act"></div></div>
  <div class="strip" id="strip" hidden aria-live="polite"></div>
</header>
<main>
  <div id="nightView">
    <div class="demo-bar glass" id="demoBar" hidden><span>Demo Night · Nothing Is Saved</span><button class="chip-btn" id="demoNext">Next Game</button></div>
    <section class="start" id="startBox" hidden>
      <div class="stp glass"><div class="sn">1</div><div class="sb"><h3>Who Are We Bowling?</h3>
        <input id="oppName" class="inp" placeholder="Opponent Team" autocomplete="off" autocapitalize="words" enterkeyhint="done" maxlength="40"></div></div>
      <div class="stp glass" id="step2"><div class="sn">2</div><div class="sb"><h3>Scoreboard Photos</h3><p>Both Lanes, Whole Screen</p>
        <button class="addp" id="startAdd" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.6-2.2h6.8L17 8h3v11H4z"/><circle cx="12" cy="13.4" r="3.3"/></svg><span id="startLbl">Add Game 1</span></button></div></div>
    </section>
    <ul id="uploads" class="uploads"></ul>
    <div id="board"></div>
    <div id="clearBox" class="clear-box"><button id="clearNight" class="btn-clear">Clear Whole Night</button><small>Removes Tonight's Photos And Scores · Asks First</small></div>
    <details id="screensBox" class="glass screens-box"><summary><span>Screens &amp; Fixes</span><small>Tap A Number To Fix It</small><span class="chev">›</span></summary><div id="screens"></div></details>
  </div>
  <section id="past" hidden></section>
  <section id="stats" hidden></section>
  <section id="more" hidden>
    <div class="glass more-list">
      <button id="mRules" class="more-item"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5h10.5a2 2 0 0 1 2 2V20H7a2 2 0 0 1-2-2zM5 18a2 2 0 0 1 2-2h10.5M8.5 8.5h5.5M8.5 11.5h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>League Rules</span><i class="chev">›</i></button>
      <button id="mTips" class="more-item"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l1.6-2.2h6.8L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1zM12 16.9a3.6 3.6 0 1 0 0-7.2 3.6 3.6 0 0 0 0 7.2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Photo Tips</span><i class="chev">›</i></button>
      <button id="mShare" class="more-item"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5v11M8 7.5l4-4 4 4M6 11.5H5a1 1 0 0 0-1 1V20a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7.5a1 1 0 0 0-1-1h-1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Share Link</span><i class="chev">›</i></button>
    </div>
    <div class="glass more-list">
      <button id="resetNight" class="more-item danger"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 9A8 8 0 1 1 4 13M4.5 4v5h5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Clear Whole Night</span><i class="chev">›</i></button>
      <button id="logout" class="more-item quiet"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 7.5a3.5 3.5 0 1 1-3.4 4.4L4 19.5V16h3v-3h2.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Change Team Code</span><i class="chev">›</i></button>
    </div>
    <p class="foot" id="ver"></p>
  </section>
  <input type="file" id="lib" accept="image/*" multiple hidden>
</main>
<nav class="tabbar" id="tabbar" aria-label="Sections">
  <button data-t="tonight" class="on"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c1.6 0 2.5 1.3 2.5 2.9 0 1.3-.7 2.2-.7 3.2 0 1.4 2.7 3.4 2.7 7.4 0 3.3-1.6 5.5-4.5 6.5-2.9-1-4.5-3.2-4.5-6.5 0-4 2.7-6 2.7-7.4 0-1-.7-1.9-.7-3.2C9.5 3.3 10.4 2 12 2z" fill="currentColor"/><path d="M9.6 8.6h4.8M9.9 10.2h4.2" stroke="#16121f" stroke-width="1.1"/></svg><span>Tonight</span></button>
  <button data-t="past"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>Past Weeks</span></button>
  <button data-t="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 20v-6M10 20V9M15 20v-9M20 20V4"/></svg><span>Stats</span></button>
  <button data-t="more"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg><span>More</span></button>
</nav>
</div>
<div id="sheet" class="sheet" hidden>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-h"><h3 id="sheetTitle"></h3><button id="sheetClose" class="sheet-x" aria-label="Close">&#10005;</button></div>
    <div id="sheetBody" class="sheet-b"></div>
  </div>
</div>
<div id="toast" class="toast" role="status" hidden></div>
<div id="modal" class="modal" hidden>
  <div class="modal-card glass" role="alertdialog" aria-modal="true" aria-labelledby="mTitle" aria-describedby="mBody">
    <div class="modal-icon" aria-hidden="true">&#8634;</div>
    <h3 id="mTitle"></h3>
    <p id="mBody"></p>
    <div class="modal-btns"><button class="btn-ghost" id="mCancel">Cancel</button><button class="btn-danger" id="mOk">Clear</button></div>
  </div>
</div>
<script type="module" src="app.js?v=11"></script>
</body>
</html>
